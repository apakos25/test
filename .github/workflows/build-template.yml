name: Compile Minimized Godot Template

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev mingw-w64 upx

      - name: Configure MinGW to use POSIX threads
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          
      - name: Load SCons Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.scons_cache\
          key: ${{ runner.os }}-godot-scons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-godot-scons-
            
      - name: Clone Godot Engine Source
        run: git clone --depth 1 --branch 4.6.2-stable https://github.com/godotengine/godot.git godot-source

      - name: Compile Custom Template
        run: |
          cd godot-source
          scons platform=windows target=template_release disable_path_overrides=no debug_symbols=no scu_build=yes optimize=size linker=sys lto=none use_lld=no werror=no warnings=no custom_modules="" module_3d_enabled=no openxr=no vulkan=no use_volk=no module_multiplayer_enabled=no d3d12=no module_gltf_enabled=no module_godot_physics_3d_enabled=no scons_cache="${{ github.workspace }}\.scons_cache" -j2

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-minimized-template
          path: godot-source/bin/godot.windows.template_release.x86_64.exe
