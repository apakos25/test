name: Compile Minimized Godot Template

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev mingw-w64 upx

      - name: Clone Godot Engine Source
        run: |
          git clone --depth 1 --branch 4.3-stable https://github.com godot-source

      - name: Compile Custom Template
        run: |
          cd godot-source
          scons platform=windows target=template_release optimize=size use_lto=yes custom_modules="" module_3d_enabled=no module_msdfgen_enabled=no module_navigation_enabled=no module_multiplayer_enabled=no production=yes

      - name: Compress with UPX
        run: |
          upx --best godot-source/bin/godot.windows.template_release.x86_64.exe

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-minimized-template
          path: godot-source/bin/godot.windows.template_release.x86_64.exe
